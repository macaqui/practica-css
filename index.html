<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel · Tarjeta personal</title>
    <!-- React y Babel incluidos en el proyecto: funcionan sin internet -->
    <script src="./vendor/react.development.js"></script>
    <script src="./vendor/react-dom.development.js"></script>
    <!-- (Babel local) -->
    <script src="./vendor/babel.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // En local y en Render la API esta en el mismo servidor; en GitHub Pages uso la de Render.
        const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.indexOf('onrender.com') !== -1) ? '' : 'https://practica-css.onrender.com';

        function Card() {
            const [frases, setFrases] = useState([]);
            const [autor, setAutor] = useState('');
            const [texto, setTexto] = useState('');
            const [aviso, setAviso] = useState('');

            function cargar() {
                fetch(API + '/api/frases')
                    .then(function (r) { return r.json(); })
                    .then(function (datos) {
                        setFrases(datos);
                        setAviso('');
                    })
                    .catch(function () {
                        setAviso('No se pudo conectar con el servidor');
                    });
            }

            useEffect(function () { cargar(); }, []);

            function agregar(e) {
                e.preventDefault();
                if (!autor.trim() || !texto.trim()) return;
                fetch(API + '/api/frases', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ autor: autor, texto: texto })
                })
                    .then(function () { setAutor(''); setTexto(''); cargar(); })
                    .catch(function () { setAviso('No se pudo conectar con el servidor'); });
            }

            function borrar(id) {
                fetch(API + '/api/frases/' + id, { method: 'DELETE' })
                    .then(function () { cargar(); })
                    .catch(function () { setAviso('No se pudo conectar con el servidor'); });
            }

            const principal = frases[0];

            return (
                <>
                    <div className="content">
                        <div className="info">
                            <h1 className="name">Samuel 😁</h1>
                            <p className="ms">
                                {principal
                                    ? '"' + principal.texto + '" - ' + principal.autor
                                    : 'Cargando frase...'}
                            </p>
                            <br />
                            <img src="./img/1.jpg" alt="One Piece" />
                        </div>
                    </div>

                    <div className="bloque">
                        <h2 className="titulo">Frases</h2>
                        <ul className="lista-frases">
                            {frases.map(function (f) {
                                return (
                                    <li key={f.id} className="fila-frase">
                                        <div>
                                            <p className="texto-frase">{f.texto}</p>
                                            <p className="autor-frase">{f.autor}</p>
                                        </div>
                                        <button onClick={function () { borrar(f.id); }}>Borrar</button>
                                    </li>
                                );
                            })}
                        </ul>
                        <form className="form-frase" onSubmit={agregar}>
                            <input
                                value={autor}
                                onChange={function (e) { setAutor(e.target.value); }}
                                placeholder="Autor"
                            />
                            <input
                                value={texto}
                                onChange={function (e) { setTexto(e.target.value); }}
                                placeholder="Texto de la frase"
                            />
                            <button type="submit">Agregar</button>
                        </form>
                        {aviso ? <p className="aviso">{aviso}</p> : null}
                    </div>
                </>
            );
        }

        // Renderizar la aplicación en el DOM virtual
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Card />);
    </script>
</body>

</html>
